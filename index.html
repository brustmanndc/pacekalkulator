<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Pace Kalkulator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <main class="app">
        <header>
            <h1>Pace Kalkulator</h1>
        </header>

        <form id="pace-form">
            <label for="distance">Streckenlänge (Meter)</label>
            <input type="number" id="distance" min="1" placeholder="zB: 1000" required>

            <label for="hours">Stunden</label>
            <input type="number" id="hour" min="0" required>

            <label for="minutes">Minuten</label>
            <input type="number" id="minutes" min="0" max="59" required>

            <label for="seconds">Sekunden</label>
            <input type="number" id="seconds" min="0" max="59" required>

            <label for="date">Datum</label>
            <input type="date" id="date" required>

            <button type="submit">Pace Berechnen & Speichern</button>
        </form>
            <label id="result">
                <h2>Deine Pace</h2>
                <p id="pace"></p>
            </label>

            <label id="saved-runs">
                <h2>Gespeicherte Läufe</h2>
                <ul id="saved-run-list"></ul>
            </label>

    </main>

    <script src="app.js"></script>
        
</body>
</html>
